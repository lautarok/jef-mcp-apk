<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Forwarder</title>
  <style>
    html, body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: #121212;
      color: #eeeeee;
    }
    .container {
      padding: 20px;
      box-sizing: border-box;
      max-width: 640px;
      margin: 0 auto;
    }
    .screen {
      display: none;
    }
    .screen.active {
      display: block;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .top-bar h2, .top-bar h3 {
      margin: 0;
    }
    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
      color: #bbbbbb;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #333;
      font-size: 15px;
    }
    input, select {
      background: #1e1e1e;
      color: #ffffff;
    }
    button {
      margin-top: 12px;
      background: #2e7d32;
      color: #ffffff;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button.sec {
      background: #37474f;
    }
    button.nav-btn {
      background: #1565c0;
    }
    button.small-btn {
      width: auto;
      margin-top: 0;
      padding: 8px 12px;
      font-size: 13px;
    }
    button.danger {
      width: auto;
      margin-top: 0;
      padding: 8px 12px;
      font-size: 13px;
      background: #8e2424;
    }
    .section-box {
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 14px;
      margin-top: 16px;
    }
    .rule-row {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }
    .rule-row input, .rule-row select {
      margin-top: 0;
      padding: 10px;
      font-size: 14px;
    }
    .status {
      margin-top: 12px;
      font-size: 14px;
      color: #81c784;
      min-height: 20px;
      word-break: break-word;
    }
    .status.error {
      color: #ef9a9a;
    }
    .hint {
      font-size: 12px;
      color: #9e9e9e;
      margin-top: 6px;
    }
    hr {
      margin: 22px 0;
      border: 0;
      border-top: 1px solid #2c2c2c;
    }
  </style>
</head>
<body>
  <!-- PANTALLA 1: CONFIGURACIÓN GENERAL -->
  <div id="screen-main" class="container screen active">
    <h2>SMS Forwarder</h2>

    <label for="url">URL base o endpoint HTTP</label>
    <input type="text" id="url" placeholder="http://192.168.1.50:8000">

    <label for="token">Token / API Key (X-Api-Key)</label>
    <input type="password" id="token" placeholder="tu-token-secreto">

    <button onclick="guardar()">Guardar configuración</button>
    <button class="nav-btn" onclick="irAReglas()">Reglas de creación de mensajes</button>

    <div id="status-main" class="status"></div>

    <hr>

    <button class="sec" onclick="AndroidBridge.abrirPermisosNotificaciones()">
      1. Activar acceso a notificaciones
    </button>
    <button class="sec" onclick="AndroidBridge.abrirAjustesBateria()">
      2. Ignorar optimización de batería
    </button>
  </div>

  <!-- PANTALLA 2: REGLAS DE CREACIÓN DE MENSAJES -->
  <div id="screen-rules" class="container screen">
    <div class="top-bar">
      <h2>Reglas de mensajes</h2>
      <button class="sec small-btn" onclick="volverPrincipal()">Volver</button>
    </div>
    <div class="hint">
      Propiedades válidas: <strong>content</strong>, <strong>platform</strong> y <strong>sender</strong>.
    </div>

    <button type="button" class="nav-btn" onclick="cargarDesdeServidor()">
      Cargar reglas desde servidor (GET /v1/config)
    </button>

    <div class="section-box">
      <div class="top-bar">
        <h3>Allow</h3>
        <button type="button" class="small-btn" onclick="agregarRegla('allow')">+ Filtro</button>
      </div>
      <div id="allow-list"></div>
    </div>

    <div class="section-box">
      <div class="top-bar">
        <h3>Prevent</h3>
        <button type="button" class="small-btn" onclick="agregarRegla('prevent')">+ Filtro</button>
      </div>
      <div id="prevent-list"></div>
    </div>

    <button onclick="guardarYSincronizarReglas()">Guardar</button>

    <div id="status-rules" class="status"></div>
  </div>

  <script>
    const ALLOWED_PROPERTIES = ['content', 'platform', 'sender'];

    const DEFAULT_RULES = {
      allow: [],
      prevent: []
    };

    let state = {
      allow: [],
      prevent: []
    };

    window.onload = function () {
      document.getElementById('url').value = AndroidBridge.getUrl();
      document.getElementById('token').value = AndroidBridge.getToken();
      cargarReglasDesdeBridge();
    };

    function mostrarPantalla(id) {
      document.querySelectorAll('.screen').forEach((el) => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function irAReglas() {
      cargarReglasDesdeBridge();
      renderReglas();
      setStatus('status-rules', '', false);
      mostrarPantalla('screen-rules');
      cargarDesdeServidor();
    }

    function volverPrincipal() {
      setStatus('status-main', '', false);
      mostrarPantalla('screen-main');
    }

    function setStatus(elementId, msg, isError) {
      const el = document.getElementById(elementId);
      el.textContent = msg;
      el.classList.toggle('error', Boolean(isError));
    }

    function guardar() {
      const url = document.getElementById('url').value.trim();
      const token = document.getElementById('token').value.trim();
      AndroidBridge.guardarConfig(url, token);
      setStatus('status-main', 'Configuración guardada.', false);
    }

    function normalizarProperty(rawProp) {
      const prop = String(rawProp || '').trim();
      return ALLOWED_PROPERTIES.includes(prop) ? prop : 'content';
    }

    function normalizarListaReglas(rawList) {
      if (!Array.isArray(rawList)) return [];
      return rawList.map((item) => ({
        property: normalizarProperty(item?.property),
        include: String(item?.includes ?? item?.include ?? '')
      }));
    }

    function aplicarEstructuraConfig(parsed) {
      const creation = parsed?.message?.creation ?? parsed;
      state = {
        allow: normalizarListaReglas(creation?.allow),
        prevent: normalizarListaReglas(creation?.prevent)
      };
    }

    function cargarReglasDesdeBridge() {
      const raw = AndroidBridge.getRulesJson();
      if (!raw) {
        state = {
          allow: DEFAULT_RULES.allow.map((r) => ({ ...r })),
          prevent: DEFAULT_RULES.prevent.map((r) => ({ ...r }))
        };
        return;
      }

      try {
        const parsed = JSON.parse(raw);
        aplicarEstructuraConfig(parsed);
      } catch (_) {
        state = { allow: [], prevent: [] };
      }
    }

    function cargarDesdeServidor() {
      const url = document.getElementById('url').value.trim();
      const token = document.getElementById('token').value.trim();
      if (url) {
        AndroidBridge.guardarConfig(url, token);
      }
      setStatus('status-rules', 'Consultando GET /v1/config...', false);
      AndroidBridge.obtenerReglasGet();
    }

    function agregarRegla(grupo) {
      sincronizarInputsAEstado();
      state[grupo].push({ property: 'platform', include: '' });
      renderReglas();
    }

    function eliminarRegla(grupo, index) {
      sincronizarInputsAEstado();
      state[grupo].splice(index, 1);
      renderReglas();
    }

    function sincronizarInputsAEstado() {
      ['allow', 'prevent'].forEach((grupo) => {
        const rows = document.querySelectorAll(`.rule-row[data-group="${grupo}"]`);
        const nextList = [];
        rows.forEach((row) => {
          const propEl = row.querySelector('.rule-property');
          const incEl = row.querySelector('.rule-include');
          nextList.push({
            property: normalizarProperty(propEl.value),
            include: incEl.value
          });
        });
        state[grupo] = nextList;
      });
    }

    function renderReglas() {
      ['allow', 'prevent'].forEach((grupo) => {
        const container = document.getElementById(`${grupo}-list`);
        container.innerHTML = '';

        state[grupo].forEach((rule, idx) => {
          const row = document.createElement('div');
          row.className = 'rule-row';
          row.dataset.group = grupo;

          const select = document.createElement('select');
          select.className = 'rule-property';
          const currentProp = normalizarProperty(rule.property);

          ALLOWED_PROPERTIES.forEach((optVal) => {
            const opt = document.createElement('option');
            opt.value = optVal;
            opt.textContent = optVal;
            if (currentProp === optVal) opt.selected = true;
            select.appendChild(opt);
          });

          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'rule-include';
          input.placeholder = 'valor a incluir';
          input.value = rule.include ?? '';

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'danger';
          delBtn.textContent = 'X';
          delBtn.onclick = () => eliminarRegla(grupo, idx);

          row.appendChild(select);
          row.appendChild(input);
          row.appendChild(delBtn);
          container.appendChild(row);
        });
      });
    }

    function construirPayloadLimpio() {
      sincronizarInputsAEstado();
      const limpiar = (arr) =>
        arr
          .map((r) => ({
            property: normalizarProperty(r.property),
            include: String(r.include || '').trim()
          }))
          .filter((r) => r.include.length > 0);

      return JSON.stringify({
        allow: limpiar(state.allow),
        prevent: limpiar(state.prevent)
      });
    }

    function guardarSoloLocal() {
      const payloadJson = construirPayloadLimpio();
      AndroidBridge.guardarReglasJson(payloadJson);
      setStatus('status-rules', 'Reglas guardadas en el dispositivo.', false);
    }

    function guardarYSincronizarReglas() {
      const url = document.getElementById('url').value.trim();
      const token = document.getElementById('token').value.trim();
      if (url) {
        AndroidBridge.guardarConfig(url, token);
      }

      const payloadJson = construirPayloadLimpio();
      AndroidBridge.guardarReglasJson(payloadJson);

      setStatus('status-rules', 'Enviando PUT /v1/config...', false);
      AndroidBridge.enviarReglasPut(payloadJson);
    }

    // Callback invocado desde Kotlin al terminar GET /v1/config
    function onReglasGetResult(ok, rawJsonOrError) {
      if (!ok) {
        setStatus('status-rules', rawJsonOrError, true);
        return;
      }

      try {
        const parsed = JSON.parse(rawJsonOrError);
        aplicarEstructuraConfig(parsed);
        AndroidBridge.guardarReglasJson(JSON.stringify({
          allow: state.allow,
          prevent: state.prevent
        }));
        renderReglas();
        setStatus('status-rules', 'Reglas cargadas desde GET /v1/config.', false);
      } catch (_) {
        setStatus('status-rules', 'Respuesta inválida en GET /v1/config.', true);
      }
    }

    // Callback invocado desde Kotlin al terminar PUT /v1/config
    function onReglasSyncResult(ok, message) {
      setStatus('status-rules', message, !ok);
    }
  </script>
</body>
</html>
